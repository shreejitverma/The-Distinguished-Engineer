[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "fast_crc32"
version = "0.1.0"
description = "High-performance CRC32 computation using PyO3 Rust extension"
requires-python = ">=3.9"

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module"]
module-name = "fast_crc32._core"
python-source = "python"
