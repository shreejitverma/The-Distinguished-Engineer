[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-engineering-labs"
version = "0.1.0"
description = "Executable verification labs for 20-API-Engineering"
requires-python = ">=3.12,<3.16"
dependencies = [
  "pydantic==2.14.3",
  "pydantic-core==2.50.4",
  "pydantic-settings==2.16.2",
  "fastapi==0.162.0",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
  "uvloop==0.23.0; sys_platform != 'win32'",
  "httptools==0.9.0",
  "hypercorn==0.18.0",
  "h11==0.16.0",
  "h2==4.4.1",
  "aioquic==1.7.2",
  "wsproto==1.3.2",
  "websockets==17.4",
  "granian==2.8.7",
  "gunicorn==26.2.0",
  "anyio==4.16.0",
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "psycopg[binary]==3.3.8",
  "aiosqlite==0.22.1",
  "httpx==0.28.1",
  "httpcore==1.0.9",
  "schemathesis==4.33.1",
  "hypothesis==6.170.14",
  "jsonschema==4.26.0",
  "openapi-spec-validator==0.9.0",
  "datamodel-code-generator==0.89.0",
  "openapi-python-client==0.29.1",
  "PyJWT==2.15.1",
  "joserfc==1.8.0",
  "authlib==1.9.5",
  "cryptography==50.0.2",
  "pwdlib[argon2]==0.3.1",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.33",
  "itsdangerous==2.2.0",
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-instrumentation-fastapi==0.66b2",
  "opentelemetry-instrumentation-asgi==0.66b2",
  "opentelemetry-instrumentation-sqlalchemy==0.66b2",
  "opentelemetry-instrumentation-httpx==0.66b2",
  "prometheus-client==0.26.0",
  "structlog==26.1.0",
  "grpcio==1.85.1",
  "protobuf==7.36.2",
  "strawberry-graphql[fastapi]==0.340.0",
  "sse-starlette==3.6.0",
  "orjson==3.13.0",
  "msgspec==0.22.0",
  "tenacity==9.2.1",
  "stamina==26.1.0",
  "limits==5.8.0",
  "slowapi==0.1.10",
  "redis==8.1.0",
  "valkey==6.2.0",
  "fakeredis[lua]==2.40.0",
  "locust==2.47.0",
  "litestar==2.25.0",
  "celery==5.7.0",
  "dramatiq==2.2.1",
  "mcp==2.3.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "dirty-equals==0.11",
  "inline-snapshot==0.36.1",
  "polyfactory==3.5.0",
  "asgi-lifespan==2.1.0",
  "ruff==0.17.4",
  "mypy==2.4.1",
  "pyright==1.1.414",
]
sqlalchemy21 = ["sqlalchemy[asyncio]==2.1.8"]
sqlalchemy20 = ["sqlalchemy[asyncio]==2.0.57"]

[tool.uv]
package = true
default-groups = ["dev", "sqlalchemy21"]
conflicts = [[{ group = "sqlalchemy21" }, { group = "sqlalchemy20" }]]

[tool.hatch.build.targets.wheel]
packages = ["src/api_labs"]

[tool.pytest.ini_options]
minversion = "9.0"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "unit: in-memory ASGI, state machine, or wire parser lab (no sockets or external daemons)",
  "socket: binds ephemeral 127.0.0.1:0 loopback sockets for TLS, HTTP/2, QUIC, or worker signal labs",
]

[tool.coverage.run]
source = ["api_labs"]
branch = true
data_file = ".pytest_cache/.coverage"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF", "PT", "FAST", "SIM", "TC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
